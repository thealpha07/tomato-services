version: '3.8'

services:
  tomato-frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:4000
    image: tomato-frontend:latest
    container_name: tomato-frontend
    ports:
      - "5173:80"
    restart: unless-stopped

  tomato-admin:
    build:
      context: ./admin
      args:
        VITE_BACKEND_URL: http://localhost:4000
    image: tomato-admin:latest
    container_name: tomato-admin
    ports:
      - "5174:80"
    restart: unless-stopped
