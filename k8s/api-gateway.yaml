apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: localhost:5000/api-gateway:latest
        ports:
        - containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: FOOD_SERVICE_URL
          value: "http://food-service:4001"
        - name: USER_SERVICE_URL
          value: "http://user-service:4003"
        - name: CART_SERVICE_URL
          value: "http://cart-service:4005"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:4006"
        - name: ALLOWED_ORIGINS
          value: "http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:3001,http://localhost:30000,http://localhost:30001"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
